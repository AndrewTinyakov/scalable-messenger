$schema: http://json-schema.org/draft-07/schema#
title: ChatCreatedEventV1
type: object
additionalProperties: false
required: [type, version, eventId, room, chatId]
properties:
  type:
    const: chat_created
  version:
    type: integer
    const: 1
  eventId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  room:
    type: string
    pattern: '^user:[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  requestId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
