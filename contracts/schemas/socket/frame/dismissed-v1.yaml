$schema: http://json-schema.org/draft-07/schema#
title: SocketDismissedV1
description: Explicitly resolve an unseen interval through this chat sequence without claiming device application. Older SQL history remains available.
x-messenger-direction: client
type: object
additionalProperties: false
required: [type, version, chatId, sequence]
properties:
  type:
    const: dismissed
  version:
    type: integer
    const: 1
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  sequence:
    type: string
    pattern: '^[1-9][0-9]*$'
