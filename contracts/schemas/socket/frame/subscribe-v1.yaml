$schema: http://json-schema.org/draft-07/schema#
title: SocketSubscribeV1
x-messenger-direction: client
type: object
additionalProperties: false
required: [type, version, chatId, kind]
properties:
  type:
    const: subscribe
  version:
    type: integer
    const: 1
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  kind:
    $ref: ../../common/chat-kind.yaml
  epoch:
    type: string
  streamId:
    type: string
  lastAppliedSequence:
    description: Recovery baseline. After an explicit dismissed frame this may include a skipped interval and does not imply application of every earlier message.
    type: string
    pattern: '^(0|[1-9][0-9]*)$'
