  /v1/chats/{id}/members/{userId}:
    delete:
      tags:
      - chat-controller
      operationId: removeMember
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
components:
  schemas:
    SendStatusesRequest:
      type: object
      properties:
        requestIds:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 1
      required:
      - requestIds
    SendStatusEntry:
      type: object
      properties:
        requestId:
          type: string
        result:
          $ref: "#/components/schemas/SendStatusResponse"
      required:
      - requestId
      - result
    SendStatusResponse:
      type: object
      properties:
        status:
          type: string
        chatId:
          type:
          - string
          - "null"
        messageId:
          type:
          - string
          - "null"
        sequence:
          type:
          - string
          - "null"
        reason:
          type:
          - string
          - "null"
      required:
      - status
    SendStatusesResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SendStatusEntry"
      required:
      - results
    AddGroupMembersRequest:
      type: object
      properties:
        memberIds:
          type: array
          items:
            type: string
          maxItems: 1000
          minItems: 1
      required:
      - memberIds
    CreateGroupChatRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 0
        memberIds:
          type: array
          items:
            type: string
          maxItems: 999
          minItems: 1
      required:
      - memberIds
      - name
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type:
          - string
          - "null"
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        memberCount:
          type: integer
          format: int32
        lastSequence:
          type: string
      required:
      - id
      - kind
      - lastSequence
      - memberCount
      - members
    UserResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
      required:
      - id
      - username
    WsTicketResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: integer
          format: int64
      required:
      - expiresAt
      - token
    AuthRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 40
          minLength: 3
        password:
          type: string
          maxLength: 100
          minLength: 8
        deviceId:
          type:
          - string
          - "null"
      required:
      - password
      - username
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
        deviceId:
          type: string
      required:
      - deviceId
      - token
      - user
    ChatPageResponse:
      type: object
      properties:
        chats:
          type: array
          items:
            $ref: "#/components/schemas/ChatResponse"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - chats
    MessageHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageResponse"
        nextSequence:
          type: string
        hasMore:
          type: boolean
      required:
      - hasMore
      - messages
      - nextSequence
    MessageResponse:
      type: object
      properties:
        id:
          type: string
        chatId:
          type: string
        sequence:
          type: string
        senderId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - body
      - chatId
      - createdAt
      - id
      - senderId
      - sequence
    SessionResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        deviceId:
          type: string
      required:
      - deviceId
      - userId
      - username
    ApiProblem:
      type: object
      properties:
        status:
          type: integer
          format: int32
        detail:
          type: string
        code:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
