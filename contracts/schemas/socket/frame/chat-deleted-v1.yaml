$schema: http://json-schema.org/draft-07/schema#
title: SocketChatDeletedV1
type: object
additionalProperties: false
required:
  - type
  - version
  - eventId
  - room
  - chatId
  - seq
  - epoch
  - streamId
properties:
  type:
    const: chat_deleted
  version:
    type: integer
    const: 1
  eventId: &a1
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  room:
    type: string
    pattern: ^(user|group):[0-7][0-9A-HJKMNP-TV-Z]{25}$
  chatId: *a1
  seq:
    type: string
    pattern: ^[1-9][0-9]{0,18}$
  epoch:
    type: string
    minLength: 1
  streamId:
    type: string
    pattern: ^[0-9]+-[0-9]+$
x-messenger-direction: server
