$schema: http://json-schema.org/draft-07/schema#
title: SocketSubscribeV1
type: object
additionalProperties: false
required: [type, version, conversationId]
properties:
  type:
    const: subscribe
  version:
    type: integer
    const: 1
  conversationId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  epoch:
    type: string
  streamId:
    type: string
  lastAppliedSequence:
    type: string
    pattern: '^(0|[1-9][0-9]*)$'
