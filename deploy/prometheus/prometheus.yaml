global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: api
    metrics_path: /api/actuator/prometheus
    basic_auth:
      username: metrics
      password: messenger-metrics
    static_configs:
      - targets: [api-1:8080, api-2:8080]

  - job_name: command-processor
    metrics_path: /actuator/prometheus
    basic_auth:
      username: metrics
      password: messenger-metrics
    dns_sd_configs:
      - names: [messenger-command-processor]
        type: A
        port: 8082
        refresh_interval: 15s

  - job_name: outbox-publisher
    metrics_path: /actuator/prometheus
    basic_auth:
      username: metrics
      password: messenger-metrics
    dns_sd_configs:
      - names: [messenger-outbox-publisher]
        type: A
        port: 8082
        refresh_interval: 15s

  - job_name: ws
    static_configs:
      - targets: [ws-1:8081, ws-2:8081]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq-1:15692, rabbitmq-2:15692, rabbitmq-3:15692]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      queue: ['^messenger\.send\.(0|1|2|3|dead)$']
      family: [queue_coarse_metrics, queue_metrics, queue_delivery_metrics]
    static_configs:
      - targets: [rabbitmq-1:15692, rabbitmq-2:15692, rabbitmq-3:15692]

  - job_name: redis
    metrics_path: /scrape
    static_configs:
      - targets:
          - redis://redis-1:6379
          - redis://redis-2:6379
          - redis://redis-3:6379
          - redis://redis-4:6379
          - redis://redis-5:6379
          - redis://redis-6:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: ingress
    static_configs:
      - targets: [nginx-exporter-client:9113]
        labels: {tier: client}
      - targets: [nginx-exporter-api:9113]
        labels: {tier: api}
      - targets: [nginx-exporter-ws:9113]
        labels: {tier: ws}

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
