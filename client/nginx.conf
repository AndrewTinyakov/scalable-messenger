limit_req_zone $binary_remote_addr zone=messenger_auth_ip:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=messenger_ticket_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=messenger_ws_ip:10m rate=3r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_backend api-proxy:80;
    set $ws_backend ws-proxy:80;
    limit_req_status 429;

    location ^~ /api/actuator/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=messenger_auth_ip burst=10 nodelay;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/ws-ticket {
        limit_req zone=messenger_ticket_ip burst=20 nodelay;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws {
        limit_req zone=messenger_ws_ip burst=10 nodelay;
        access_log off;
        proxy_pass http://$ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8083;
    location = /stub_status {
        access_log off;
        stub_status;
    }
}
