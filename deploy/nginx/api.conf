include /etc/nginx/conf.d/trusted-proxies.inc;
include /etc/nginx/conf.d/client-origin.inc;
map $request_method $messenger_rate_limited_client {
    OPTIONS "";
    default $binary_remote_addr;
}
limit_conn_zone $binary_remote_addr zone=messenger_connections:10m;
limit_req_zone $messenger_rate_limited_client zone=messenger_auth_ip:10m rate=${AUTH_IP_RATE};
limit_req_zone $messenger_rate_limited_client zone=messenger_ticket_ip:10m rate=${TICKET_IP_RATE};
resolver 127.0.0.11 valid=5s ipv6=off;

upstream messenger_api {
    zone messenger_api 64k;
    least_conn;
    keepalive 64;
    server api-1:8080 resolve max_fails=3 fail_timeout=10s;
    server api-2:8080 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 8083;
    location = /stub_status {
        access_log off;
        stub_status;
    }
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/conf.d/edge-security.inc;
    location = /healthz { access_log off; return 200 "ok\n"; }
    limit_req_status 429;
    server_tokens off;
    error_page 429 502 503 504 @edge_error;

    if ($uri ~ ";") {
        return 404;
    }

    location @edge_error {
        include /etc/nginx/conf.d/edge-headers.inc;
        add_header Access-Control-Allow-Origin $messenger_cors_origin always;
        add_header Access-Control-Allow-Credentials $messenger_cors_credentials always;
        add_header Vary Origin always;
        default_type application/problem+json;
        return 200 '{"status":$status,"detail":"The API edge could not complete the request"}';
    }

    location = /api/actuator {
        return 404;
    }

    location ^~ /api/actuator/ {
        return 404;
    }

    location ~ ^/api/v1/auth/(login|register)/?$ {
        limit_req zone=messenger_auth_ip burst=${AUTH_IP_BURST} nodelay;
        proxy_pass http://messenger_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/auth/ws-ticket {
        limit_req zone=messenger_ticket_ip burst=${TICKET_IP_BURST} nodelay;
        proxy_pass http://messenger_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/v1/ {
        proxy_pass http://messenger_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
