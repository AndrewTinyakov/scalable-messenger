resolver 127.0.0.11 valid=1s ipv6=off;
resolver_timeout 2s;
upstream messenger_api {
  zone api 64k;
  server api-gateway:3001 resolve max_fails=1 fail_timeout=2s;
}
upstream messenger_ws {
  zone ws 64k;
  least_conn;
  server ws-gateway:3002 resolve max_fails=1 fail_timeout=2s;
}
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://messenger_api;
    proxy_set_header Host $host;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503;
  }
  location /ws {
    proxy_pass http://messenger_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
