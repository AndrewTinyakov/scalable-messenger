resolver 127.0.0.11 valid=5s ipv6=off;
upstream monitoring_prometheus {
    zone monitoring_prometheus 64k;
    server prometheus:9090 resolve;
}
upstream monitoring_alertmanager {
    zone monitoring_alertmanager 64k;
    server alertmanager:9093 resolve;
}
upstream monitoring_grafana {
    zone monitoring_grafana 64k;
    server grafana:3000 resolve;
}
upstream monitoring_inbox {
    zone monitoring_inbox 64k;
    server alert-inbox:8025 resolve;
}
map $http_upgrade $monitoring_connection {
    default upgrade;
    '' close;
}
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $monitoring_connection;
proxy_read_timeout 75s;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
server_tokens off;

server {
    listen 80;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
server {
    listen 9090;
    include /var/run/monitoring-access.inc;
    location / { proxy_pass http://monitoring_prometheus; }
}
server {
    listen 9093;
    include /var/run/monitoring-access.inc;
    location / { proxy_pass http://monitoring_alertmanager; }
}
server {
    listen 3000;
    include /var/run/monitoring-access.inc;
    location / { proxy_pass http://monitoring_grafana; }
}
server {
    listen 8025;
    include /var/run/monitoring-access.inc;
    location / { proxy_pass http://monitoring_inbox; }
}
