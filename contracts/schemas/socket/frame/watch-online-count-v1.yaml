$schema: http://json-schema.org/draft-07/schema#
title: SocketWatchOnlineCountV1
x-messenger-direction: client
type: object
additionalProperties: false
required:
  - type
  - version
properties:
  type:
    const: watch_online_count
  version:
    type: integer
    const: 1
  chatId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
