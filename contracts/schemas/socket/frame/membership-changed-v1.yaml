$schema: http://json-schema.org/draft-07/schema#
title: SocketMembershipChangedV1
x-messenger-direction: server
type: object
additionalProperties: false
x-messenger-group-room: true
description: Membership metadata invalidation. Room must equal group:<chatId>; no message sequence or delivery acknowledgement.
required: [type, version, eventId, room, chatId, seq, epoch, streamId]
properties:
  type:
    const: membership_changed
  version:
    type: integer
    const: 1
  eventId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  room:
    type: string
    pattern: '^group:[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  seq:
    type: string
    pattern: ^[1-9][0-9]{0,18}$
  epoch:
    type: string
    minLength: 1
  streamId:
    type: string
    pattern: '^[0-9]+-[0-9]+$'
