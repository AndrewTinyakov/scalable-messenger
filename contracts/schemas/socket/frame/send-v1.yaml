$schema: http://json-schema.org/draft-07/schema#
title: SocketSendV1
x-messenger-direction: client
type: object
additionalProperties: false
required:
  - type
  - version
  - requestId
  - body
oneOf:
  - required:
      - chatId
  - required:
      - recipientId
properties:
  type:
    const: send
  version:
    type: integer
    const: 1
  chatId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  recipientId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  requestId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  body:
    type: string
    minLength: 1
    maxLength: 4000
  replyToMessageId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  forwardFromChatId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  forwardFromMessageId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
allOf:
  - if:
      required:
        - replyToMessageId
    then:
      required:
        - chatId
      not:
        required:
          - recipientId
  - if:
      anyOf:
        - required:
            - forwardFromChatId
        - required:
            - forwardFromMessageId
    then:
      required:
        - chatId
        - forwardFromChatId
        - forwardFromMessageId
      not:
        anyOf:
          - required:
              - recipientId
          - required:
              - replyToMessageId
