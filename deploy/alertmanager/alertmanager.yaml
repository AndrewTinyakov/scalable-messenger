global:
  smtp_smarthost: alert-inbox:1025
  smtp_from: messenger-alerts@localhost
  smtp_require_tls: false

route:
  receiver: local-warning
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-critical
      matchers: ['severity="critical"']
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, job, instance]

receivers:
  - name: local-warning
    email_configs:
      - to: messenger-warning@localhost
        send_resolved: true
  - name: local-critical
    email_configs:
      - to: messenger-critical@localhost
        send_resolved: true
