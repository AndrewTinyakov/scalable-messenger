name: messenger

x-database-environment: &database-environment
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messenger
  SPRING_DATASOURCE_USERNAME: messenger_api
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_API_PASSWORD:?Run scripts/dev-up.sh}
  SPRING_FLYWAY_USER: messenger_migrator
  SPRING_FLYWAY_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Run scripts/dev-up.sh}

x-public-nginx: &public-nginx
  cap_drop: [ALL]
  cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /etc/nginx/conf.d
    - /var/cache/nginx
    - /var/run
  healthcheck:
    test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
    interval: 10s
    timeout: 3s
    retries: 3

x-api: &api
  image: messenger-api:local
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  build:
    context: .
    dockerfile: kotlin/api/Dockerfile
  environment: &api-environment
    <<: *database-environment
    METRICS_USERNAME: metrics
    METRICS_PASSWORD: ${METRICS_PASSWORD:?Run scripts/dev-up.sh}
    MESSENGER_HTTP_PROXY_PATTERN: '${MESSENGER_HTTP_PROXY_PATTERN:-10\.246\.0\.10}'
    CLIENT_ORIGIN: ${MESSENGER_CLIENT_ORIGIN:-http://localhost:8080}
    SESSION_COOKIE_SECURE: ${MESSENGER_SESSION_COOKIE_SECURE:-true}
    WS_TICKET_SECRET: ${WS_TICKET_SECRET:?Run scripts/dev-up.sh to generate a local secret}
    MESSENGER_GRPC_CA_FILE: /run/messenger-grpc/ca.pem
    MESSENGER_GRPC_CERT_FILE: /run/messenger-grpc/api-cert.pem
    MESSENGER_GRPC_KEY_FILE: /run/messenger-grpc/api-key.pem
    MESSENGER_GRPC_ALLOWED_CLIENT_IDENTITY: spiffe://messenger/ws
  group_add:
    - '${MESSENGER_GRPC_GID:?Run scripts/dev-up.sh to prepare local gRPC certificates}'
  volumes:
    - ./.local/grpc/ca.pem:/run/messenger-grpc/ca.pem:ro
    - ./.local/grpc/api-cert.pem:/run/messenger-grpc/api-cert.pem:ro
    - ./.local/grpc/api-key.pem:/run/messenger-grpc/api-key.pem:ro
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

x-ws: &ws
  image: messenger-ws:local
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  build: ./ws
  environment:
    WS_ADDRESS: :8081
    API_GRPC_ADDRESS: dns:///api-grpc:9090
    API_GRPC_SERVER_NAME: api-grpc
    API_GRPC_CA_FILE: /run/messenger-grpc/ca.pem
    API_GRPC_CERT_FILE: /run/messenger-grpc/ws-cert.pem
    API_GRPC_KEY_FILE: /run/messenger-grpc/ws-key.pem
    WS_TICKET_SECRET: ${WS_TICKET_SECRET:?Run scripts/dev-up.sh to generate a local secret}
    RABBITMQ_URLS: amqp://messenger:${RABBITMQ_PASSWORD:?Run scripts/dev-up.sh}@rabbitmq-1:5672/,amqp://messenger:${RABBITMQ_PASSWORD:?Run scripts/dev-up.sh}@rabbitmq-2:5672/,amqp://messenger:${RABBITMQ_PASSWORD:?Run scripts/dev-up.sh}@rabbitmq-3:5672/
    REDIS_URL: redis://:${REDIS_PASSWORD:?Run scripts/dev-up.sh}@redis-1:6379/0
    REDIS_CLUSTER_NODES: redis-1:6379,redis-2:6379,redis-3:6379
    WS_ALLOWED_ORIGIN: ${MESSENGER_CLIENT_ORIGIN:-http://localhost:8080}
    WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-10000}
    WS_MAX_ROOMS: ${WS_MAX_ROOMS:-100000}
    WS_MAX_MEMBERSHIPS: ${WS_MAX_MEMBERSHIPS:-1000000}
    WS_MAX_PENDING_UPGRADES: ${WS_MAX_PENDING_UPGRADES:-128}
    WS_DRAIN_TIMEOUT: ${WS_DRAIN_TIMEOUT:-5s}
    WS_SHUTDOWN_TIMEOUT: ${WS_SHUTDOWN_TIMEOUT:-10s}
  group_add:
    - '${MESSENGER_GRPC_GID:?Run scripts/dev-up.sh to prepare local gRPC certificates}'
  volumes:
    - ./.local/grpc/ca.pem:/run/messenger-grpc/ca.pem:ro
    - ./.local/grpc/ws-cert.pem:/run/messenger-grpc/ws-cert.pem:ro
    - ./.local/grpc/ws-key.pem:/run/messenger-grpc/ws-key.pem:ro
  networks:
    app:
    data:
    monitoring:
    grpc:
  ulimits:
    nofile: { soft: 262144, hard: 262144 }
  stop_grace_period: 20s
  healthcheck:
    test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/readyz]
    interval: 5s
    timeout: 2s
    retries: 6
    start_period: 20s
  depends_on:
    rabbitmq-cluster-init:
      condition: service_completed_successfully
    redis-cluster-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    networks: [data]
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      # Slow-plan logging is off unless explicitly enabled for diagnosis on an isolated dataset:
      # plans and statement text can contain inlined values.
      - auto_explain.log_min_duration=${POSTGRES_SLOW_PLAN_MS:--1}
      - -c
      - auto_explain.log_parameter_max_length=0
      - -c
      - auto_explain.log_nested_statements=on
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track_planning=off
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/dev-up.sh}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?Run scripts/dev-up.sh}
      POSTGRES_COMMAND_PASSWORD: ${POSTGRES_COMMAND_PASSWORD:?Run scripts/dev-up.sh}
      POSTGRES_PUBLISHER_PASSWORD: ${POSTGRES_PUBLISHER_PASSWORD:?Run scripts/dev-up.sh}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Run scripts/dev-up.sh}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?Run scripts/dev-up.sh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d messenger"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq-1:
    networks: [data, monitoring]
    image: rabbitmq:4.3.5-management
    hostname: rabbitmq-1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Run scripts/dev-up.sh}
      RABBITMQ_DEFAULT_USER: messenger
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/dev-up.sh}
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq-2:
    networks: [data, monitoring]
    image: rabbitmq:4.3.5-management
    hostname: rabbitmq-2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Run scripts/dev-up.sh}
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    depends_on:
      rabbitmq-1: { condition: service_healthy }
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq-3:
    networks: [data, monitoring]
    image: rabbitmq:4.3.5-management
    hostname: rabbitmq-3
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Run scripts/dev-up.sh}
    volumes:
      - rabbitmq-3-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    depends_on:
      rabbitmq-2: { condition: service_healthy }
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq-cluster-init:
    networks: [data]
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Run scripts/dev-up.sh}
    entrypoint: [rabbitmqctl, -n, rabbit@rabbitmq-1, -t, '120', await_online_nodes, '3']
    depends_on:
      rabbitmq-1: { condition: service_healthy }
      rabbitmq-2: { condition: service_healthy }
      rabbitmq-3: { condition: service_healthy }
    restart: 'no'

  redis-1:
    image: redis:7.4-alpine
    mem_limit: ${MESSENGER_REDIS_CONTAINER_MEMORY:-256m}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run scripts/dev-up.sh}
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --masterauth, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --cluster-enabled, 'yes', --cluster-config-file, nodes.conf, --cluster-node-timeout, '5000', --cluster-announce-ip, '${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.11', --appendonly, 'yes', --maxmemory, '${MESSENGER_REDIS_MAXMEMORY:-128mb}', --maxmemory-policy, noeviction]
    networks:
      data:
        ipv4_address: ${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.11
    volumes:
      - redis-1-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-2:
    image: redis:7.4-alpine
    mem_limit: ${MESSENGER_REDIS_CONTAINER_MEMORY:-256m}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run scripts/dev-up.sh}
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --masterauth, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --cluster-enabled, 'yes', --cluster-config-file, nodes.conf, --cluster-node-timeout, '5000', --cluster-announce-ip, '${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.12', --appendonly, 'yes', --maxmemory, '${MESSENGER_REDIS_MAXMEMORY:-128mb}', --maxmemory-policy, noeviction]
    networks:
      data:
        ipv4_address: ${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.12
    volumes:
      - redis-2-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-3:
    image: redis:7.4-alpine
    mem_limit: ${MESSENGER_REDIS_CONTAINER_MEMORY:-256m}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run scripts/dev-up.sh}
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --masterauth, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --cluster-enabled, 'yes', --cluster-config-file, nodes.conf, --cluster-node-timeout, '5000', --cluster-announce-ip, '${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.13', --appendonly, 'yes', --maxmemory, '${MESSENGER_REDIS_MAXMEMORY:-128mb}', --maxmemory-policy, noeviction]
    networks:
      data:
        ipv4_address: ${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.13
    volumes:
      - redis-3-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-4:
    image: redis:7.4-alpine
    mem_limit: ${MESSENGER_REDIS_CONTAINER_MEMORY:-256m}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run scripts/dev-up.sh}
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --masterauth, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --cluster-enabled, 'yes', --cluster-config-file, nodes.conf, --cluster-node-timeout, '5000', --cluster-announce-ip, '${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.14', --appendonly, 'yes', --maxmemory, '${MESSENGER_REDIS_MAXMEMORY:-128mb}', --maxmemory-policy, noeviction]
    networks:
      data:
        ipv4_address: ${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.14
    volumes:
      - redis-4-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-5:
    image: redis:7.4-alpine
    mem_limit: ${MESSENGER_REDIS_CONTAINER_MEMORY:-256m}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run scripts/dev-up.sh}
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --masterauth, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --cluster-enabled, 'yes', --cluster-config-file, nodes.conf, --cluster-node-timeout, '5000', --cluster-announce-ip, '${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.15', --appendonly, 'yes', --maxmemory, '${MESSENGER_REDIS_MAXMEMORY:-128mb}', --maxmemory-policy, noeviction]
    networks:
      data:
        ipv4_address: ${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.15
    volumes:
      - redis-5-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-6:
    image: redis:7.4-alpine
    mem_limit: ${MESSENGER_REDIS_CONTAINER_MEMORY:-256m}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run scripts/dev-up.sh}
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --masterauth, "${REDIS_PASSWORD:?Run scripts/dev-up.sh}", --cluster-enabled, 'yes', --cluster-config-file, nodes.conf, --cluster-node-timeout, '5000', --cluster-announce-ip, '${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.16', --appendonly, 'yes', --maxmemory, '${MESSENGER_REDIS_MAXMEMORY:-128mb}', --maxmemory-policy, noeviction]
    networks:
      data:
        ipv4_address: ${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.16
    volumes:
      - redis-6-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-cluster-init:
    networks: [data]
    image: redis:7.4-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run scripts/dev-up.sh}
    entrypoint: [sh, -ec]
    command:
      - >-
        if test "$$(redis-cli -h redis-1 cluster nodes | wc -l)" -eq 1; then
          redis-cli --cluster create redis-1:6379 redis-2:6379 redis-3:6379 redis-4:6379 redis-5:6379 redis-6:6379 --cluster-replicas 1 --cluster-yes;
        fi;
        attempt=0;
        until redis-cli -h redis-1 cluster info | grep -q 'cluster_state:ok' &&
          test "$$(redis-cli -h redis-1 cluster nodes | grep -c ' connected')" -eq 6; do
          attempt=$$((attempt + 1));
          if test "$$attempt" -ge 60; then exit 1; fi;
          sleep 1;
        done
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }
    restart: 'no'

  api-1:
    <<: *api
    environment:
      <<: *api-environment
      MESSENGER_GRPC_BIND_ADDRESS: api-1-grpc
    networks:
      app:
      data:
      monitoring:
      grpc:
        aliases: [api-grpc, api-1-grpc]

  api-2:
    <<: *api
    environment:
      <<: *api-environment
      MESSENGER_GRPC_BIND_ADDRESS: api-2-grpc
    networks:
      app:
      data:
      monitoring:
      grpc:
        aliases: [api-grpc, api-2-grpc]

  messenger-command-processor:
    networks: [data, monitoring]
    image: messenger-command-processor:local
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: .
      dockerfile: kotlin/command-processor/Dockerfile
    deploy:
      replicas: 2
    environment:
      <<: *database-environment
      SPRING_DATASOURCE_USERNAME: messenger_command
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_COMMAND_PASSWORD:?Run scripts/dev-up.sh}
      METRICS_USERNAME: metrics
      METRICS_PASSWORD: ${METRICS_PASSWORD:?Run scripts/dev-up.sh}
      MESSENGER_SEND_BATCH_SIZE: ${MESSENGER_SEND_BATCH_SIZE:-16}
      MESSENGER_SEND_CONSUMERS: ${MESSENGER_SEND_CONSUMERS:-4}
      MESSENGER_SEND_PREFETCH: ${MESSENGER_SEND_PREFETCH:-20}
      SPRING_RABBITMQ_USERNAME: messenger
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run scripts/dev-up.sh}
      SPRING_RABBITMQ_ADDRESSES: amqp://messenger:${RABBITMQ_PASSWORD:?Run scripts/dev-up.sh}@rabbitmq-1:5672/,amqp://messenger:${RABBITMQ_PASSWORD:?Run scripts/dev-up.sh}@rabbitmq-2:5672/,amqp://messenger:${RABBITMQ_PASSWORD:?Run scripts/dev-up.sh}@rabbitmq-3:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq-cluster-init: { condition: service_completed_successfully }
    restart: unless-stopped

  messenger-outbox-publisher:
    networks: [data, monitoring]
    image: messenger-outbox-publisher:local
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: .
      dockerfile: kotlin/outbox-publisher/Dockerfile
    deploy:
      replicas: 2
    environment:
      <<: *database-environment
      SPRING_DATASOURCE_USERNAME: messenger_publisher
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PUBLISHER_PASSWORD:?Run scripts/dev-up.sh}
      METRICS_USERNAME: metrics
      METRICS_PASSWORD: ${METRICS_PASSWORD:?Run scripts/dev-up.sh}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/dev-up.sh}
      SPRING_DATA_REDIS_CLUSTER_NODES: redis-1:6379,redis-2:6379,redis-3:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis-cluster-init: { condition: service_completed_successfully }
    restart: unless-stopped

  api-proxy:
    <<: *public-nginx
    networks:
      edge:
      app:
        ipv4_address: ${MESSENGER_APP_IP_PREFIX:-10.246.0}.10
    image: nginx:1.30.5-alpine
    ports:
      - '${MESSENGER_BIND_ADDRESS:-127.0.0.1}:${MESSENGER_API_PORT:-8081}:80'
    environment:
      AUTH_IP_RATE: ${MESSENGER_AUTH_IP_RATE:-1r/s}
      AUTH_IP_BURST: ${MESSENGER_AUTH_IP_BURST:-10}
      TICKET_IP_RATE: ${MESSENGER_TICKET_IP_RATE:-5r/s}
      TICKET_IP_BURST: ${MESSENGER_TICKET_IP_BURST:-20}
      MESSENGER_PUBLIC_SCHEME: ${MESSENGER_PUBLIC_SCHEME:-http}
      MESSENGER_TRUSTED_PROXY_CIDRS: ${MESSENGER_TRUSTED_PROXY_CIDRS:-}
      MESSENGER_FRONT_PROXY_CIDR: ${MESSENGER_EDGE_IP_PREFIX:-10.247.0}.10/32
      MESSENGER_CONNECTION_LIMIT: ${MESSENGER_CONNECTION_LIMIT:-200}
      NGINX_ENVSUBST_FILTER: '^(AUTH_IP_|TICKET_IP_|WS_UPGRADE_|MESSENGER_CONNECTION_LIMIT$)'
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./deploy/nginx/configure-edge.sh:/docker-entrypoint.d/19-configure-edge.sh:ro
      - ./deploy/nginx/api.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped

  ws:
    <<: *ws
    deploy:
      replicas: ${MESSENGER_WS_REPLICAS:-2}

  ws-proxy:
    <<: *public-nginx
    networks:
      edge:
      app:
        ipv4_address: ${MESSENGER_APP_IP_PREFIX:-10.246.0}.11
    image: nginx:1.30.5-alpine
    ports:
      - '${MESSENGER_BIND_ADDRESS:-127.0.0.1}:${MESSENGER_WS_PORT:-8082}:80'
    environment:
      WS_UPGRADE_RATE: ${MESSENGER_WS_UPGRADE_RATE:-30r/s}
      WS_UPGRADE_BURST: ${MESSENGER_WS_UPGRADE_BURST:-100}
      MESSENGER_PUBLIC_SCHEME: ${MESSENGER_PUBLIC_SCHEME:-http}
      MESSENGER_TRUSTED_PROXY_CIDRS: ${MESSENGER_TRUSTED_PROXY_CIDRS:-}
      MESSENGER_FRONT_PROXY_CIDR: ${MESSENGER_EDGE_IP_PREFIX:-10.247.0}.10/32
      MESSENGER_CONNECTION_LIMIT: ${MESSENGER_CONNECTION_LIMIT:-200}
      NGINX_ENVSUBST_FILTER: '^(AUTH_IP_|TICKET_IP_|WS_UPGRADE_|MESSENGER_CONNECTION_LIMIT$)'
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./deploy/nginx/configure-edge.sh:/docker-entrypoint.d/19-configure-edge.sh:ro
      - ./deploy/nginx/ws.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ws: { condition: service_healthy }
    restart: unless-stopped

  client:
    <<: *public-nginx
    networks:
      edge:
        ipv4_address: ${MESSENGER_EDGE_IP_PREFIX:-10.247.0}.10
    build:
      context: ./client
    environment:
      MESSENGER_API_BASE_URL: ${MESSENGER_API_BASE_URL:-http://localhost:8081/api}
      MESSENGER_WS_URL: ${MESSENGER_WS_URL:-ws://localhost:8082/ws}
      MESSENGER_PUBLIC_SCHEME: ${MESSENGER_PUBLIC_SCHEME:-http}
      MESSENGER_TRUSTED_PROXY_CIDRS: ${MESSENGER_TRUSTED_PROXY_CIDRS:-}
      MESSENGER_CONNECTION_LIMIT: ${MESSENGER_CONNECTION_LIMIT:-200}
    volumes:
      - ./deploy/nginx/configure-edge.sh:/docker-entrypoint.d/19-configure-edge.sh:ro
    ports:
      - '${MESSENGER_BIND_ADDRESS:-127.0.0.1}:${MESSENGER_PORT:-8080}:80'
    depends_on: [api-proxy, ws-proxy]
    restart: unless-stopped

  cadvisor:
    networks: [monitoring]
    image: ghcr.io/google/cadvisor:0.55.1
    profiles: [container-metrics]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --housekeeping_interval=5s
      - --docker_only=true
      - --containerd=/var/run/containerd.sock
      - --containerd-namespace=moby
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - ${MESSENGER_CONTAINERD_SOCKET:-/var/run/docker/containerd/containerd.sock}:/var/run/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    mem_limit: 256m
    restart: unless-stopped

  postgres-observability-init:
    networks: [data]
    image: postgres:17-alpine
    command: [psql, --host=postgres, --username=postgres, --dbname=messenger, --set=ON_ERROR_STOP=1, --file=/observability.sql]
    environment:
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/dev-up.sh}
    volumes:
      - ./deploy/postgres/observability.sql:/observability.sql:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres-exporter:
    networks: [data, monitoring]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    command:
      - --extend.query-path=/etc/postgres-exporter/queries.yaml
      - --collector.stat_statements
      - --collector.stat_statements.limit=25
      - --no-collector.stat_statements.include_query
    volumes:
      - ./deploy/postgres-exporter:/etc/postgres-exporter:ro
    environment:
      DATA_SOURCE_URI: postgres:5432/messenger?sslmode=disable&options=-csearch_path%3Dobservability%2Cpublic
      DATA_SOURCE_USER: messenger_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?Run scripts/dev-up.sh}
    depends_on:
      postgres-observability-init: { condition: service_completed_successfully }
    restart: unless-stopped

  redis-exporter:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/dev-up.sh}
    networks: [data, monitoring]
    image: oliver006/redis_exporter:v1.89.0
    depends_on:
      redis-cluster-init: { condition: service_completed_successfully }
    restart: unless-stopped

  monitoring-access:
    <<: *public-nginx
    networks: [edge, monitoring]
    image: nginx:1.30.5-alpine
    environment:
      MONITORING_ALLOWED_PEERS: ${MESSENGER_MONITORING_ALLOWED_PEERS:-}
      MONITORING_HOST_CIDR: ${MESSENGER_EDGE_IP_PREFIX:-10.247.0}.1/32
    entrypoint: [/bin/sh, /configure-monitoring.sh]
    volumes:
      - ./deploy/nginx/monitoring.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/configure-monitoring.sh:/configure-monitoring.sh:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
      - '127.0.0.1:${ALERT_INBOX_PORT:-8025}:8025'
    depends_on: [prometheus, alertmanager, grafana, alert-inbox]
    restart: unless-stopped

  prometheus:
    group_add: ['${MESSENGER_GRPC_GID:?Run scripts/dev-up.sh}']
    networks: [monitoring]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
      - ${MESSENGER_METRICS_PASSWORD_FILE:-./.local/secrets/metrics-password}:/run/secrets/metrics-password:ro
    restart: unless-stopped

  alert-inbox:
    networks: [monitoring]
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
      MP_SMTP_AUTH_ACCEPT_ANY: 'false'
    volumes:
      - alert-inbox-data:/data
    mem_limit: 128m
    restart: unless-stopped

  alertmanager:
    networks: [monitoring]
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    networks: [monitoring]
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/dev-up.sh}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  nginx-exporter-client:
    networks: [edge, monitoring]
    image: nginx/nginx-prometheus-exporter:1.5.1
    command: [--nginx.scrape-uri=http://client:8083/stub_status]
    depends_on: [client]
    restart: unless-stopped

  nginx-exporter-api:
    networks: [edge, monitoring]
    image: nginx/nginx-prometheus-exporter:1.5.1
    command: [--nginx.scrape-uri=http://api-proxy:8083/stub_status]
    depends_on: [api-proxy]
    restart: unless-stopped

  nginx-exporter-ws:
    networks: [edge, monitoring]
    image: nginx/nginx-prometheus-exporter:1.5.1
    command: [--nginx.scrape-uri=http://ws-proxy:8083/stub_status]
    depends_on: [ws-proxy]
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-1-data:
  rabbitmq-2-data:
  rabbitmq-3-data:
  redis-1-data:
  redis-2-data:
  redis-3-data:
  redis-4-data:
  redis-5-data:
  redis-6-data:
  prometheus-data:
  alertmanager-data:
  alert-inbox-data:
  grafana-data:

networks:
  edge:
    ipam:
      config:
        - subnet: ${MESSENGER_EDGE_SUBNET:-10.247.0.0/24}
          gateway: ${MESSENGER_EDGE_IP_PREFIX:-10.247.0}.1
          ip_range: ${MESSENGER_EDGE_IP_PREFIX:-10.247.0}.128/25
  app:
    internal: true
    ipam:
      config:
        - subnet: ${MESSENGER_APP_SUBNET:-10.246.0.0/24}
          ip_range: ${MESSENGER_APP_IP_PREFIX:-10.246.0}.128/25
  data:
    internal: true
    ipam:
      config:
        - subnet: ${MESSENGER_SUBNET:-10.245.0.0/24}
          ip_range: ${MESSENGER_REDIS_IP_PREFIX:-10.245.0}.128/25
  monitoring:
    internal: true
  grpc:
    internal: true
