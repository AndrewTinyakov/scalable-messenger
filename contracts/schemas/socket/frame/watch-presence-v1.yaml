$schema: http://json-schema.org/draft-07/schema#
title: SocketWatchPresenceV1
x-messenger-direction: client
type: object
additionalProperties: false
required:
  - type
  - version
properties:
  type:
    const: watch_presence
  version:
    type: integer
    const: 1
  reset:
    type: boolean
  add: &a1
    type: array
    maxItems: 500
    uniqueItems: true
    items:
      type: string
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  remove: *a1
