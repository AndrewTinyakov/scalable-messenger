components:
  schemas:
    SendStatusesRequest:
      type: object
      properties:
        requestIds:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 1
      required:
      - requestIds
    SendStatusEntry:
      type: object
      properties:
        requestId:
          type: string
        result:
          $ref: "#/components/schemas/SendStatusResponse"
      required:
      - requestId
      - result
    SendStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - UNKNOWN
          - SAVED
          - REJECTED
        chatId:
          type:
          - string
          - "null"
        messageId:
          type:
          - string
          - "null"
        sequence:
          type:
          - string
          - "null"
        reason:
          type:
          - string
          - "null"
          enum:
          - NOT_A_MEMBER
          - CHAT_NOT_FOUND
          - RECIPIENT_NOT_FOUND
          - INVALID_RECIPIENT
          - EMPTY_BODY
          - BODY_TOO_LONG
          - REQUEST_ID_CONFLICT
          - PROCESSING_FAILED
          - INVALID_REPLY_TARGET
      required:
      - status
    SendStatusesResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SendStatusEntry"
      required:
      - results
    AdvanceReadRequest:
      type: object
      properties:
        throughSequence:
          type: string
      required:
      - throughSequence
    ReadProgressResponse:
      type: object
      properties:
        throughSequence:
          type: string
        readAt:
          type:
          - string
          - "null"
          format: date-time
        serverTime:
          type: string
          format: date-time
      required:
      - readAt
      - serverTime
      - throughSequence
    AddGroupMembersRequest:
      type: object
      properties:
        memberIds:
          type: array
          items:
            type: string
          maxItems: 1000
          minItems: 1
      required:
      - memberIds
    CreateGroupChatRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 0
        memberIds:
          type: array
          items:
            type: string
          maxItems: 999
          minItems: 1
      required:
      - memberIds
      - name
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - DIRECT
          - GROUP
        name:
          type:
          - string
          - "null"
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        memberCount:
          type: integer
          format: int32
        lastSequence:
          type: string
        ownerId:
          type:
          - string
          - "null"
      required:
      - id
      - kind
      - lastSequence
      - memberCount
      - members
    UserResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
      required:
      - id
      - username
    WsTicketResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: integer
          format: int64
      required:
      - expiresAt
      - token
    AuthRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 40
          minLength: 3
        password:
          type: string
          maxLength: 100
          minLength: 8
        deviceId:
          type:
          - string
          - "null"
      required:
      - password
      - username
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        deviceId:
          type: string
      required:
      - deviceId
      - user
    EditMessageRequest:
      type: object
      properties:
        body:
          type: string
        expectedVersion:
          type: string
      required:
      - body
      - expectedVersion
    MessageResponse:
      type: object
      properties:
        id:
          type: string
        chatId:
          type: string
        sequence:
          type: string
        senderId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        messageVersion:
          type: string
        editedAt:
          type:
          - string
          - "null"
          format: date-time
        deletedAt:
          type:
          - string
          - "null"
          format: date-time
        replyToMessageId:
          type:
          - string
          - "null"
        replySenderId:
          type:
          - string
          - "null"
        replyBody:
          type:
          - string
          - "null"
        replyDeleted:
          type:
          - boolean
          - "null"
        replyVersion:
          type:
          - string
          - "null"
      required:
      - body
      - chatId
      - createdAt
      - deletedAt
      - editedAt
      - id
      - messageVersion
      - replyBody
      - replyDeleted
      - replySenderId
      - replyToMessageId
      - replyVersion
      - senderId
      - sequence
    ChatPageResponse:
      type: object
      properties:
        chats:
          type: array
          items:
            $ref: "#/components/schemas/ChatResponse"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - chats
    ReadSummaryResponse:
      type: object
      properties:
        throughSequence:
          type: string
        maxOtherReadSequence:
          type: string
        serverTime:
          type: string
          format: date-time
      required:
      - maxOtherReadSequence
      - serverTime
      - throughSequence
    MessageHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageResponse"
        nextSequence:
          type: string
        hasMore:
          type: boolean
        mutationRevision:
          type: string
      required:
      - hasMore
      - messages
      - mutationRevision
      - nextSequence
    MessageReaderResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        readAt:
          type: string
          format: date-time
      required:
      - readAt
      - userId
      - username
    MessageReadsResponse:
      type: object
      properties:
        readers:
          type: array
          items:
            $ref: "#/components/schemas/MessageReaderResponse"
        nextUserId:
          type:
          - string
          - "null"
        detailsAvailable:
          type: boolean
        detailsExpiresAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
      required:
      - detailsAvailable
      - detailsExpiresAt
      - nextUserId
      - readers
      - serverTime
    MessageChangeResponse:
      type: object
      properties:
        revision:
          type: string
        message:
          $ref: "#/components/schemas/MessageResponse"
      required:
      - message
      - revision
    MessageChangesResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/MessageChangeResponse"
        lastRevision:
          type: string
        nextRevision:
          type: string
        resetRequired:
          type: boolean
      required:
      - changes
      - lastRevision
      - nextRevision
      - resetRequired
    MessageAroundResponse:
      type: object
      properties:
        anchorMessageId:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageResponse"
        hasOlder:
          type: boolean
        hasNewer:
          type: boolean
        mutationRevision:
          type: string
      required:
      - anchorMessageId
      - hasNewer
      - hasOlder
      - messages
      - mutationRevision
    GroupMemberPageResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - members
      - nextCursor
    DirectChatResponse:
      type: object
      properties:
        recipient:
          $ref: "#/components/schemas/UserResponse"
        chat:
          oneOf:
          - $ref: "#/components/schemas/ChatResponse"
          - type: "null"
      required:
      - chat
      - recipient
    SessionResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        deviceId:
          type: string
      required:
      - deviceId
      - userId
      - username
    ApiProblem:
      type: object
      properties:
        status:
          type: integer
          format: int32
        detail:
          type: string
        code:
          type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      name: messenger_session
      in: cookie
