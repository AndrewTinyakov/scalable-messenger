$schema: http://json-schema.org/draft-07/schema#
title: SocketAppliedV1
description: Cumulative device application for a chat since its recovery baseline. A previously dismissed prefix remains dismissed and is not retroactively applied.
type: object
additionalProperties: false
required: [type, version, chatId, sequence]
properties:
  type:
    const: applied
  version:
    type: integer
    const: 1
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  sequence:
    type: string
    pattern: '^(0|[1-9][0-9]*)$'
  epoch:
    type: string
  streamId:
    type: string
