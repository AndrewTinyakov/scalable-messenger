$schema: http://json-schema.org/draft-07/schema#
title: SocketSidebarActivityV1
x-messenger-direction: server
type: object
additionalProperties: false
required: [type, version, chatId, sequence]
properties:
  type:
    const: sidebar_activity
  version:
    type: integer
    const: 1
  chatId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  sequence:
    type: string
    pattern: ^[1-9][0-9]*$
