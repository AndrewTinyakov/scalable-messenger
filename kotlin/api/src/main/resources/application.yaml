server:
  port: 8080
spring:
  application:
    name: messenger-api
  security:
    user:
      name: ${METRICS_USERNAME:metrics}
      password: ${METRICS_PASSWORD:${random.uuid}}
      roles: MONITORING
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
    default-property-inclusion: non_null
  mvc:
    servlet:
      path: /api
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${DATABASE_USER:messenger}
    password: ${DATABASE_PASSWORD:messenger}
  flyway:
    enabled: true
  jooq:
    sql-dialect: postgres
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
messenger:
  grpc:
    port: ${MESSENGER_GRPC_PORT:9090}
  auth:
    ws-ticket-secret: ${WS_TICKET_SECRET}
  web:
    allowed-origin: ${CLIENT_ORIGIN:http://localhost:5173}
