groups:
  - name: messenger-deletion-cleanup
    rules:
      - alert: MessengerHistoryPurgeDelayed
        expr: max(messenger_deletion_purge_oldest_seconds) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Message history purge is delayed
          description: Accepted deletion hides content, but the oldest physical purge has remained unfinished for over fifteen minutes. Inspect purge progress and retry panels.

      - alert: MessengerHistoryPurgeFailing
        expr: sum(rate(messenger_deletion_purge_retries_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Message history purge keeps failing
          description: Purge batches continue failing. Content remains hidden while durable jobs retry. Inspect database errors and purge backlog age.

  - name: messenger-scrape-availability
    rules:
      - record: messenger:minimum_scrape_targets
        expr: vector(2)
        labels:
          job: api
      - record: messenger:minimum_scrape_targets
        expr: vector(2)
        labels:
          job: command-processor
      - record: messenger:minimum_scrape_targets
        expr: vector(2)
        labels:
          job: outbox-publisher
      - record: messenger:minimum_scrape_targets
        expr: vector(2)
        labels:
          job: ws
      - record: messenger:minimum_scrape_targets
        expr: vector(3)
        labels:
          job: rabbitmq
      - record: messenger:minimum_scrape_targets
        expr: vector(3)
        labels:
          job: rabbitmq-queues
      - record: messenger:minimum_scrape_targets
        expr: vector(6)
        labels:
          job: redis
      - record: messenger:minimum_scrape_targets
        expr: vector(1)
        labels:
          job: postgres
      - record: messenger:minimum_scrape_targets
        expr: vector(2)
        labels:
          job: ingress
      - record: messenger:minimum_scrape_targets
        expr: vector(1)
        labels:
          job: containers
      - record: messenger:minimum_scrape_targets
        expr: vector(1)
        labels:
          job: alertmanager
      - record: messenger:minimum_scrape_targets
        expr: vector(1)
        labels:
          job: prometheus
      - record: messenger:unavailable_scrape_targets
        expr: clamp_min(messenger:minimum_scrape_targets - on (job) (count by (job) (up == 1) or on (job) (0 * messenger:minimum_scrape_targets)), 0)

  - name: messenger-availability
    rules:
      - alert: MessengerTargetDown
        expr: up{job=~"api|command-processor|outbox-publisher|ws|rabbitmq|rabbitmq-queues|redis|postgres|ingress|alertmanager|containers"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}."

      - alert: MessengerReplicaMissing
        expr: (count(up{job="api"}) or vector(0)) < 2 or (count(up{job="ws"}) or vector(0)) < 2 or (count(up{job="command-processor"}) or vector(0)) < 2 or (count(up{job="outbox-publisher"}) or vector(0)) < 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A Messenger application replica is missing
          description: Check the Prometheus targets page and Docker Compose replica counts.

      - alert: MessengerBrokerNodeMissing
        expr: (count(up{job="rabbitmq"}) or vector(0)) < 3 or (count(up{job="redis"}) or vector(0)) < 6
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A RabbitMQ or Redis node is missing
          description: Check cluster membership and the Prometheus targets page.

      - alert: MessengerIngressMissing
        expr: (count(up{job="ingress"}) or vector(0)) < 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A Messenger NGINX exporter is missing
          description: Check API proxy and WS proxy status.

  - name: messenger-api-and-ws
    rules:
      - alert: MessengerApiServerErrors
        expr: (sum(rate(http_server_requests_seconds_count{job="api",uri!~".*/actuator(/.*)?",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="api",uri!~".*/actuator(/.*)?"}[5m])), 0.001)) > 0.05 and sum(increase(http_server_requests_seconds_count{job="api",uri!~".*/actuator(/.*)?"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API 5xx rate exceeds 5 percent
          description: Check API logs and request latency.

      - alert: MessengerWsSlowClients
        expr: sum(increase(messenger_ws_slow_closes_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Many WebSocket clients are being closed for backpressure
          description: Check outbound queue bytes, fanout rate, and client network speed.

      - alert: MessengerWsNodeNearCapacity
        expr: messenger_ws_connections / on (instance) messenger_ws_capacity{resource="connections"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A WS node is above 80 percent of its configured connection cap
          description: Add WS capacity before new handshakes are rejected.

      - alert: MessengerWsProxyConnectionsHigh
        expr: nginx_connections_active{tier="ws"} > 8000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The WS proxy has more than 8000 active connections
          description: Check NGINX worker limits and client distribution.

      - alert: MessengerWsPositionStale
        expr: messenger_ws_oldest_room_position_seconds > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A WS room has not had a position check or live event for 90 seconds
          description: Check Redis latency and position sweep duration on {{ $labels.instance }}.

      - alert: MessengerWsPositionSweepSlow
        expr: histogram_quantile(0.95, sum by (le, instance) (rate(messenger_ws_position_sweep_seconds_bucket[5m]))) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A WS node's position sweep exceeds its 30-second target
          description: Quiet-room checks may detect missed events late.

      - alert: MessengerWsRecoverySpike
        expr: sum(increase(messenger_ws_sql_fallback_total[5m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WebSocket recovery is sending many clients to SQL history
          description: Check Redis history retention, Pub/Sub gaps, and database load.

      - alert: MessengerWsDependencyErrors
        expr: sum(increase(messenger_ws_error_frames_total{code=~"DEPENDENCY_UNAVAILABLE|PUBLISH_FAILED|PUBLISH_UNKNOWN"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WebSocket sends or subscriptions are failing on dependencies
          description: Check RabbitMQ, Redis, and gRPC authorization health.

  - name: messenger-processing
    rules:
      - alert: MessengerCommandRetries
        expr: sum(increase(messenger_command_consumed_total{outcome="retry"}[10m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Command processors are retrying sends
          description: Check dependency errors and command processor logs.

      - alert: MessengerDeadLetterBacklog
        expr: max by (queue) (rabbitmq_detailed_queue_messages_ready{queue="messenger.send.dead"}) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The send dead-letter queue has messages
          description: Inspect malformed or exhausted commands and the terminal rejection path.

      - alert: MessengerSendQueueBacklog
        expr: sum(max by (queue) (rabbitmq_detailed_queue_messages_ready{queue=~"messenger.send.[0-3]"})) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Send command queues have more than 1000 ready messages
          description: Check processor throughput, consumers, and PostgreSQL latency.

      - alert: MessengerSendQueueDelay
        expr: (sum(rate(messenger_command_queue_delay_seconds_count[5m])) - sum(rate(messenger_command_queue_delay_seconds_bucket{le="30.0"}[5m]))) / clamp_min(sum(rate(messenger_command_queue_delay_seconds_count[5m])), 0.000001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Over 5 percent of processed send commands waited longer than 30 seconds
          description: Check send queue depth, processor throughput, and PostgreSQL contention.

      - alert: MessengerSendQueueUnackedHigh
        expr: sum(max by (queue) (rabbitmq_detailed_queue_messages_unacked{queue=~"messenger.send.[0-3]"})) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 100 send commands remain unacknowledged
          description: Check slow transactions and consumer prefetch across replicas.

      - alert: MessengerSendQueueNoConsumer
        expr: max by (queue) (rabbitmq_detailed_queue_consumers{queue=~"messenger.send.[0-3]"}) == 0 and on (queue) max by (queue) (rabbitmq_detailed_queue_messages_ready{queue=~"messenger.send.[0-3]"}) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.queue }} has waiting commands and no consumer"
          description: Check command processor replicas and RabbitMQ connectivity.

      - alert: MessengerOutboxOldestEvent
        expr: max(messenger_outbox_oldest_age_seconds) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The oldest unpublished Messenger event is over one minute old
          description: Check publisher replicas, Redis errors, and outbox backlog.

      - alert: MessengerOutboxPublicationFailures
        expr: sum(increase(messenger_outbox_publish_total{result="failure"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox publishers are repeatedly failing to publish
          description: Check Redis health and publisher logs.

      - alert: MessengerOutboxSamplerFailed
        expr: messenger_outbox_backlog_sample_healthy == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A publisher cannot read outbox backlog
          description: The outbox pending and age gauges on {{ $labels.instance }} may be stale.

  - name: messenger-infrastructure
    rules:
      - alert: MessengerPostgresUnavailable
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL exporter cannot connect to the database
          description: Check PostgreSQL and the exporter credentials.

      - alert: MessengerRedisUnavailable
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A Redis Cluster node is unavailable
          description: Check Redis Cluster membership and replica promotion.

      - alert: MessengerRedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8 and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Redis memory use exceeds 80 percent of its configured limit
          description: Inspect stream retention, evictions, and memory growth on {{ $labels.instance }}.

      - alert: MessengerRedisClusterDegraded
        expr: redis_cluster_state == 0 or redis_cluster_slots_fail > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis Cluster is degraded
          description: A node reports failed slots or an unhealthy cluster state.

      - alert: MessengerRabbitAlarm
        expr: rabbitmq_alarms_memory_used_watermark > 0 or rabbitmq_alarms_free_disk_space_watermark > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: RabbitMQ resource alarm is active
          description: RabbitMQ may block publishers until memory or disk pressure clears.

      - alert: MessengerRabbitPeerUnreachable
        expr: rabbitmq_unreachable_cluster_peers_count > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A RabbitMQ node cannot reach a cluster peer
          description: Check cluster network connectivity and quorum availability.

      - alert: MessengerIngressUnavailable
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An NGINX exporter cannot reach its proxy
          description: Check the corresponding proxy container.

      - alert: MessengerPostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL connections exceed 80 percent of max_connections
          description: Check Hikari pool sizes and connection leaks across all replicas.

      - alert: MessengerJdbcPoolPending
        expr: hikaricp_connections_pending{job=~"api|command-processor|outbox-publisher"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has requests waiting for a JDBC connection"
          description: Check slow SQL, transaction length, and pool sizing.

      - alert: MessengerDatabaseInstrumentationFailure
        expr: increase(messenger_database_instrumentation_failures{job=~"api|command-processor|outbox-publisher"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Database timing observations are being lost
          description: Inspect the database recorder on {{ $labels.instance }}. Application work continues, but timing and operation counts may be incomplete.

      - alert: MessengerPostgresLockWait
        expr: messenger_postgres_activity_oldest_lock_query_age_seconds > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL queries are persistently waiting for locks
          description: Check transaction age, chat contention and the database wait panels. Query age includes time before the lock wait.

      - alert: MessengerRedisEvictions
        expr: sum(increase(redis_evicted_keys_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Redis has evicted keys
          description: Short history may disappear early and force SQL recovery.

  - name: messenger-telemetry
    rules:
      - alert: MessengerWsAppliedSlow
        expr: histogram_quantile(0.95, sum by (le, origin) (rate(messenger_ws_applied_latency_seconds_bucket{origin="saved"}[5m]))) > 1
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Device applied latency exceeds one second at p95
          description: Inspect gateway command waiting, SQL, publisher lag, and pending acknowledgements.
      - alert: MessengerWsAckTimeouts
        expr: sum(increase(messenger_ws_ack_timeouts_total[5m])) > 5
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Clients are exceeding the applied acknowledgement deadline
          description: Inspect pending ACK age and client read rates.
      - alert: MessengerWsCommandWaiting
        expr: histogram_quantile(0.95, sum by (le) (rate(messenger_ws_command_queue_wait_seconds_bucket[5m]))) > 0.2
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Gateway commands wait over 200 milliseconds at p95
          description: Compare worker service, Redis admission, and Rabbit confirmation timings.
      - alert: MessengerSendLockSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(messenger_send_chat_lock_acquire_seconds_bucket[5m]))) > 0.1
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Chat lock acquisition exceeds 100 milliseconds at p95
          description: Inspect hot chat traffic and transaction hold and completion duration.
      - alert: MessengerRedisMemoryUnbounded
        expr: redis_memory_max_bytes == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: A Redis node has no configured memory limit
          description: Configure a finite maxmemory budget and retain noeviction for shared admission state.
      - alert: MessengerAlertDeliveryFailed
        expr: sum(increase(alertmanager_notifications_failed_total[5m])) > 0
        labels: {severity: warning}
        annotations:
          summary: Alertmanager failed to deliver a notification
          description: Inspect the notification destination and Alertmanager logs.
      - alert: MessengerPrometheusScrapeSlow
        expr: scrape_duration_seconds > 4
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: A scrape nearly exceeds the local scrape interval
          description: Inspect exporter duration and reduce collection pressure if necessary.

  - name: messenger-latency
    rules:
      - alert: MessengerSendQueueLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(messenger_command_queue_delay_seconds_bucket[5m]))) > 0.2
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Command queue latency exceeds 200 milliseconds at p95
          description: Compare queue depth, batch size, chat lock duration, and transaction completion.
      - alert: MessengerPostSaveLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(messenger_ws_saved_event_lag_seconds_bucket[5m]))) > 0.2
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: SQL save to gateway latency exceeds 200 milliseconds at p95
          description: Inspect outbox age, publication latency, Redis feed health, and gateway resource pressure.

  - name: messenger-chat-features
    rules:
      - alert: MessengerPresenceResyncing
        expr: sum(rate(messenger_ws_presence_resyncs_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Presence buckets keep reloading
          description: Gateways keep losing presence subscriptions or seeing sequence gaps. Check Redis Cluster health, slot migrations and pub/sub output buffers.

      - alert: MessengerReadCleanupBehind
        expr: max(messenger_read_cleanup_oldest_age_seconds) > 300 and max(messenger_read_cleanup_backlog) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Expired read timestamp cleanup is falling behind
          description: Timestamp details remain hidden at the exact seven-day boundary. Inspect cleanup failures, database waits and the capped backlog sample.
