$schema: http://json-schema.org/draft-07/schema#
title: SessionRevokedEventV1
type: object
additionalProperties: false
required: [type, version, eventId, room, sessionId]
properties:
  type:
    const: session_revoked
  version:
    type: integer
    const: 1
  eventId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  room:
    type: string
    pattern: '^user:[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  sessionId:
    type: string
    pattern: '^[0-9a-f]{64}$'
