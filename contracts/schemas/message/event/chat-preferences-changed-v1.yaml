$schema: http://json-schema.org/draft-07/schema#
title: ChatPreferencesChangedEventV1
type: object
additionalProperties: false
required:
  - type
  - version
  - eventId
  - room
  - chatId
oneOf:
  - required:
      - memberSeq
  - required:
      - userSeq
properties:
  type:
    const: chat_preferences_changed
  version:
    type: integer
    const: 1
  eventId: &a1
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  room:
    type: string
    pattern: ^user:[0-7][0-9A-HJKMNP-TV-Z]{25}$
  chatId: *a1
  memberSeq:
    type: string
    pattern: ^[1-9][0-9]{0,18}$
  userSeq:
    type: string
    pattern: ^[1-9][0-9]{0,18}$
