$schema: http://json-schema.org/draft-07/schema#
title: SocketReceivedMessageV1
description: Acknowledge processing one live message notification without changing the durable history recovery baseline or claiming application.
x-messenger-direction: client
type: object
additionalProperties: false
required: [type, version, chatId, sequence]
properties:
  type:
    const: received_message
  version:
    type: integer
    const: 1
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  sequence:
    type: string
    pattern: '^[1-9][0-9]*$'
