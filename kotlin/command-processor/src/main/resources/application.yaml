server:
  port: 8082
spring:
  application:
    name: messenger-command-processor
  security:
    user:
      name: ${METRICS_USERNAME:metrics}
      password: ${METRICS_PASSWORD:${random.uuid}}
  jackson:
    read:
      strict-duplicate-detection: true
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      data-source-properties:
        ApplicationName: messenger-command-processor
  flyway:
    enabled: true
  jooq:
    sql-dialect: postgres
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: ${MESSENGER_SEND_CONSUMERS:4}
        prefetch: ${MESSENGER_SEND_PREFETCH:20}
management:
  metrics:
    distribution:
      slo:
        hikaricp.connections.acquire: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
        hikaricp.connections.usage: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
      percentiles-histogram:
        messenger.command.processing: true
        messenger.command.queue.delay: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
messenger:
  messaging:
    send-batch-size: ${MESSENGER_SEND_BATCH_SIZE:16}
