socketFrames:
  address: /ws
  description: A signed ticket in the WebSocket subprotocol authenticates the upgrade. The user's room joins before the API validates its
    persisted session. Internal authorization uses session IDs over mutually authenticated gRPC. Group subscriptions require current
    membership authorization and renewal. queued follows a RabbitMQ publisher confirm; message_saved and send_rejected follow a committed
    SQL result. received_message releases one live notification without advancing recovery. applied records device application; dismissed
    advances the recovery baseline without claiming application. Clients catch up from SQL history after recovery_failed or a slow-client
    disconnect.
  messages:
    SocketSendV1:
      $ref: ../messages.yaml#/messages/SocketSendV1
    SocketSubscribeV1:
      $ref: ../messages.yaml#/messages/SocketSubscribeV1
    SocketSubscribeManyV1:
