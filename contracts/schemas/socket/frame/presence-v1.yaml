$schema: http://json-schema.org/draft-07/schema#
title: SocketPresenceV1
x-messenger-direction: server
type: object
additionalProperties: false
required:
  - type
  - version
  - chatId
  - observedAt
  - validForMs
  - statuses
properties:
  type:
    const: presence
  version:
    type: integer
    const: 1
  chatId: &a1
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  observedAt:
    type: string
    format: date-time
  validForMs:
    type: integer
    minimum: 1
    maximum: 30000
  statuses:
    type: array
    maxItems: 100
    items:
      type: object
      additionalProperties: false
      required:
        - userId
        - state
      properties:
        userId: *a1
        state:
          type: string
          enum:
            - online
            - offline
            - unknown
