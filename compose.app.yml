x-application: &application
  build:
    context: .
    target: application
  environment:
    DATABASE_URL: postgres://messenger:messenger@postgres:5432/messenger
    RABBIT_URL: amqp://guest:guest@rabbitmq:5672
    REDIS_URL: redis://redis:6379
    APP_ORIGIN: http://localhost:8080
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }
services:
  migrate:
    <<: *application
    command: npm run db:migrate
    restart: "no"
  api-gateway:
    <<: *application
    command: npm run start:api-gateway
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    deploy: { replicas: 3 }
    depends_on:
      migrate: { condition: service_completed_successfully }
  ws-gateway:
    <<: *application
    command: npm run start:ws-gateway
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    deploy: { replicas: 3 }
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    <<: *application
    command: npm run start:worker
    depends_on:
      migrate: { condition: service_completed_successfully }
  relay:
    <<: *application
    command: npm run start:relay
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    build:
      context: .
      target: web
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api-gateway: { condition: service_healthy }
      ws-gateway: { condition: service_healthy }
