$schema: http://json-schema.org/draft-07/schema#
title: SocketWatchPresenceV1
x-messenger-direction: client
type: object
additionalProperties: false
required:
  - type
  - version
  - chatId
  - userIds
properties:
  type:
    const: watch_presence
  version:
    type: integer
    const: 1
  chatId: &a1
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  userIds:
    type: array
    minItems: 1
    maxItems: 100
    uniqueItems: true
    items: *a1
