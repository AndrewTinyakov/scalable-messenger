name: messenger

x-api-environment: &api-environment
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messenger
  SPRING_DATASOURCE_USERNAME: messenger
  SPRING_DATASOURCE_PASSWORD: messenger
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: messenger
  SPRING_RABBITMQ_PASSWORD: messenger
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379

x-api: &api
  image: messenger-api:local
  build: ./api
  environment:
    <<: *api-environment
    MESSENGER_ROLE: http
    MESSENGER_CONSUMER_ENABLED: 'false'
    MESSENGER_RELAY_ENABLED: 'false'
    CLIENT_ORIGIN: http://localhost:8080
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

x-ws: &ws
  image: messenger-ws:local
  build: ./ws
  environment:
    WS_ADDRESS: :8081
    API_URL: http://api-proxy
    RABBITMQ_URL: amqp://messenger:messenger@rabbitmq:5672/
    REDIS_URL: redis://redis:6379/0
    WS_ALLOWED_ORIGIN: http://localhost:8080
    WS_REAUTHORIZE_INTERVAL: 5s
  depends_on:
    api-proxy:
      condition: service_started
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: messenger
      RABBITMQ_DEFAULT_PASS: messenger
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api-1:
    <<: *api

  api-2:
    <<: *api

  command-worker:
    <<: *api
    environment:
      <<: *api-environment
      MESSENGER_ROLE: worker
      MESSENGER_CONSUMER_ENABLED: 'true'
      MESSENGER_RELAY_ENABLED: 'false'

  outbox-relay:
    <<: *api
    environment:
      <<: *api-environment
      MESSENGER_ROLE: relay
      MESSENGER_CONSUMER_ENABLED: 'false'
      MESSENGER_RELAY_ENABLED: 'true'

  api-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped

  ws-1:
    <<: *ws

  ws-2:
    <<: *ws

  ws-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/ws.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ws-1
      - ws-2
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - '8080:80'
    depends_on:
      - api-proxy
      - ws-proxy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
