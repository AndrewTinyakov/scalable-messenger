syntax = "proto3";

package messenger.authorization.v1;

option java_package = "com.andrewtinyakov.messenger.generated.grpc";
option java_multiple_files = true;
option go_package = "messenger/ws/internal/generated/grpc;authorization";

service ChatAuthorization {
  rpc AuthorizeSidebar(AuthorizeSidebarRequest) returns (AuthorizeSidebarResponse);
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  rpc ValidateSessions(ValidateSessionsRequest) returns (ValidateSessionsResponse);
  rpc AuthorizeGroup(AuthorizeGroupRequest) returns (AuthorizeGroupResponse);
  rpc AuthorizeGroups(AuthorizeGroupsRequest) returns (AuthorizeGroupsResponse);
  rpc PresenceVisibility(PresenceVisibilityRequest) returns (PresenceVisibilityResponse);
  rpc OnlineCountMembers(OnlineCountMembersRequest) returns (OnlineCountMembersResponse);
  rpc RecordLastSeen(RecordLastSeenRequest) returns (RecordLastSeenResponse);
}

message ValidateSessionRequest {
  reserved 1;
  reserved "ws_ticket";
  string session_id = 2;
}

message ValidateSessionResponse {
  string user_id = 1;
  string device_id = 2;
  string session_id = 3;
  int64 expires_at_unix_seconds = 4;
}

message ValidateSessionsRequest {
  repeated string session_ids = 1;
}

message ValidateSessionsResponse {
  repeated ValidateSessionResponse sessions = 1;
}

message AuthorizeGroupRequest {
  string chat_id = 1;
  reserved 2;
  reserved "ws_ticket";
  string session_id = 3;
}

message AuthorizeGroupResponse {
  string room = 1;
}

message AuthorizeGroupsRequest {
  repeated string chat_ids = 1;
  reserved 2;
  reserved "ws_ticket";
  string session_id = 3;
}

message AuthorizeGroupsResponse {
  repeated string authorized_chat_ids = 1;
}

enum PresenceLevel {
  PRESENCE_LEVEL_UNSPECIFIED = 0;
  PRESENCE_LEVEL_NONE = 1;
  PRESENCE_LEVEL_COARSE = 2;
  PRESENCE_LEVEL_FULL = 3;
}

message PresenceVisibilityRequest {
  string session_id = 1;
  repeated string user_ids = 2;
}

message SubjectVisibility {
  string user_id = 1;
  PresenceLevel level = 2;
  int64 last_seen_unix_ms = 3;
}

message PresenceVisibilityResponse {
  repeated SubjectVisibility subjects = 1;
}

message OnlineCountMembersRequest {
  string session_id = 1;
  string chat_id = 2;
  int32 limit = 3;
}

message OnlineCountMembersResponse {
  int32 member_count = 1;
  repeated string member_ids = 2;
}

message LastSeen {
  string user_id = 1;
  int64 seen_unix_ms = 2;
}

message RecordLastSeenRequest {
  repeated LastSeen entries = 1;
}

message RecordLastSeenResponse {}

message AuthorizeSidebarRequest {
  string session_id = 1;
  repeated string chat_ids = 2;
}
message SidebarChat {
  string chat_id = 1;
  string peer_id = 2;
  bool group = 3;
}
message AuthorizeSidebarResponse {
  repeated SidebarChat chats = 1;
}
