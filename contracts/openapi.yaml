          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /v1/sends/{requestId}:
    get:
      tags:
      - send-status-controller
      operationId: status
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SendStatusResponse"
        "401":
          description: Unauthorized
