include /etc/nginx/conf.d/trusted-proxies.inc;
limit_conn_zone $binary_remote_addr zone=messenger_connections:10m;
resolver 127.0.0.11 valid=5s ipv6=off;
upstream messenger_api_edge {
    zone messenger_api_edge 64k;
    server api-proxy:80 resolve;
    keepalive 32;
}
upstream messenger_ws_edge {
    zone messenger_ws_edge 64k;
    server ws-proxy:80 resolve;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map "$status:$uri" $messenger_cache_control {
    default "no-cache";
    ~^(200|304):/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/conf.d/edge-security.inc;
    location = /healthz { access_log off; return 200 "ok\n"; }
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' __MESSENGER_API_ORIGIN__ __MESSENGER_WS_ORIGIN__; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $messenger_cache_control always;

    location = /runtime-config.js { alias /var/run/runtime-config.js; }
    location ^~ /api/ {
        proxy_pass http://messenger_api_edge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /ws {
        proxy_pass http://messenger_ws_edge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        access_log off;
    }
    location ^~ /assets/ { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8083;
    location = /stub_status {
        access_log off;
        stub_status;
    }
}
