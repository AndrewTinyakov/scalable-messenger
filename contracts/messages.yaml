correlationIds:
  SendRequestId:
    location: $message.payload#/requestId
messages:
  SendMessageCommandV1:
    name: SendMessageCommandV1
    contentType: application/json
    correlationId:
      $ref: '#/correlationIds/SendRequestId'
    payload:
      $ref: ./schemas/message/command/send-message-v1.yaml
  MessageSavedEventV1:
    name: MessageSavedEventV1
    contentType: application/json
    correlationId:
      $ref: '#/correlationIds/SendRequestId'
    payload:
      $ref: ./schemas/message/event/message-saved-v1.yaml
  SendRejectedEventV1:
    name: SendRejectedEventV1
    contentType: application/json
    correlationId:
      $ref: '#/correlationIds/SendRequestId'
    payload:
      $ref: ./schemas/message/event/send-rejected-v1.yaml
  SocketSendV1:
    name: SocketSendV1
    contentType: application/json
    payload:
      $ref: ./schemas/socket/frame/send-v1.yaml
  SocketSubscribeV1:
    name: SocketSubscribeV1
    contentType: application/json
    payload:
      $ref: ./schemas/socket/frame/subscribe-v1.yaml
  SocketAppliedV1:
    name: SocketAppliedV1
    contentType: application/json
    payload:
      $ref: ./schemas/socket/frame/applied-v1.yaml
  SocketQueuedV1:
    name: SocketQueuedV1
    contentType: application/json
    payload:
      $ref: ./schemas/socket/frame/queued-v1.yaml
  SocketSubscribedV1:
    name: SocketSubscribedV1
    contentType: application/json
    payload:
      $ref: ./schemas/socket/frame/subscribed-v1.yaml
  SocketMessageSavedV1:
    name: SocketMessageSavedV1
    contentType: application/json
    payload:
      $ref: ./schemas/socket/frame/message-saved-v1.yaml
  SocketSendRejectedV1:
    name: SocketSendRejectedV1
    contentType: application/json
    payload:
      $ref: ./schemas/socket/frame/send-rejected-v1.yaml
  SocketRecoveryFailedV1:
    name: SocketRecoveryFailedV1
    contentType: application/json
    payload:
      $ref: ./schemas/socket/frame/recovery-failed-v1.yaml
  SocketErrorV1:
    name: SocketErrorV1
    contentType: application/json
    payload:
      $ref: ./schemas/socket/frame/error-v1.yaml
