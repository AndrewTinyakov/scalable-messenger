$schema: http://json-schema.org/draft-07/schema#
title: SocketErrorV1
type: object
additionalProperties: false
required: [type, version, code]
properties:
  type:
    const: error
  version:
    type: integer
    const: 1
  code:
    type: string
    minLength: 1
  requestId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
