include /etc/nginx/conf.d/trusted-proxies.inc;
limit_conn_zone $binary_remote_addr zone=messenger_connections:10m;
limit_req_zone $binary_remote_addr zone=messenger_ws_ip:10m rate=${WS_UPGRADE_RATE};
resolver 127.0.0.11 valid=5s ipv6=off;

upstream messenger_ws {
    zone messenger_ws 64k;
    least_conn;
    server ws:8081 resolve max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8083;
    location = /stub_status {
        access_log off;
        stub_status;
    }
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/conf.d/edge-security.inc;
    location = /healthz { access_log off; return 200 "ok\n"; }
    limit_req_status 429;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /ws {
        limit_req zone=messenger_ws_ip burst=${WS_UPGRADE_BURST} nodelay;
        access_log off;
        proxy_pass http://messenger_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Cookie "";
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_503;
        proxy_next_upstream_tries 3;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        return 404;
    }
}
