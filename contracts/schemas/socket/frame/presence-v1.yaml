$schema: http://json-schema.org/draft-07/schema#
title: SocketPresenceV1
x-messenger-direction: server
type: object
additionalProperties: false
required:
  - type
  - version
  - statuses
properties:
  type:
    const: presence
  version:
    type: integer
    const: 1
  statuses:
    type: array
    maxItems: 500
    items:
      type: object
      additionalProperties: false
      required:
        - userId
        - online
      properties:
        userId: &a1
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
        online:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
        lastSeen:
          type: string
          enum:
            - recently
            - within_week
            - within_month
            - long_ago
      not:
        required:
          - lastSeenAt
          - lastSeen
  unavailable:
    type: array
    maxItems: 500
    uniqueItems: true
    items: *a1
