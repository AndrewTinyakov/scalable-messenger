$schema: http://json-schema.org/draft-07/schema#
title: MemberRemovedEventV1
type: object
additionalProperties: false
required: [type, version, eventId, room, chatId, memberId]
properties:
  type:
    const: member_removed
  version:
    type: integer
    const: 1
  eventId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  room:
    type: string
    pattern: '^(user|group):[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  memberId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
