$schema: http://json-schema.org/draft-07/schema#
title: MembershipChangedEventV1
type: object
additionalProperties: false
x-messenger-group-room: true
description: Membership metadata invalidation. Room must equal group:<chatId>; no message sequence or delivery acknowledgement.
required: [type, version, eventId, room, chatId]
properties:
  type:
    const: membership_changed
  version:
    type: integer
    const: 1
  eventId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  room:
    type: string
    pattern: '^group:[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
