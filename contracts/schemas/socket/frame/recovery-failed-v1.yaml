$schema: http://json-schema.org/draft-07/schema#
title: SocketRecoveryFailedV1
type: object
additionalProperties: false
required: [type, version, conversationId]
properties:
  type:
    const: recovery_failed
  version:
    type: integer
    const: 1
  conversationId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  room:
    type: string
    pattern: '^(user|group):[0-7][0-9A-HJKMNP-TV-Z]{25}$'
