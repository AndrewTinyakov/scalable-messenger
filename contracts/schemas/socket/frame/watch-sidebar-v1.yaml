$schema: http://json-schema.org/draft-07/schema#
title: SocketWatchSidebarV1
x-messenger-direction: client
type: object
additionalProperties: false
required: [type, version, chatIds]
properties:
  type:
    const: watch_sidebar
  version:
    type: integer
    const: 1
  chatIds:
    type: array
    maxItems: 100
    uniqueItems: true
    items:
      type: string
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
