openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: /api
security:
- bearerAuth: []
paths:
  /v1/conversations/groups:
    post:
      tags:
      - conversation-controller
      operationId: group
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConversationView"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /v1/conversations/direct:
    post:
      tags:
      - conversation-controller
      operationId: direct
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConversationView"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /v1/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthView"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security: []
  /v1/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthView"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security: []
  /v1/users:
    get:
      tags:
      - users-controller
      operationId: search
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserView"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /v1/conversations:
    get:
      tags:
      - conversation-controller
      operationId: list
      parameters: []
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationView"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /v1/conversations/{id}/send-status/{requestId}:
    get:
      tags:
      - conversation-controller
      operationId: status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SendStatusView"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /v1/conversations/{id}/messages:
    get:
      tags:
      - conversation-controller
      operationId: messages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: afterSeq
        in: query
        required: false
        schema:
          type: string
          default: "0"
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HistoryView"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /v1/conversations/{id}/authorization:
    get:
      tags:
      - conversation-controller
      operationId: authorize
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthorizationView"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /v1/auth/session:
    get:
      tags:
      - auth-controller
      operationId: session
      parameters: []
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionView"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /v1/conversations/{id}/members/{userId}:
    delete:
      tags:
      - conversation-controller
      operationId: removeMember
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
components:
  schemas:
    GroupRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 0
        memberIds:
          type: array
          items:
            type: string
          maxItems: 49
          minItems: 1
      required:
      - memberIds
      - name
    ConversationView:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type:
          - string
          - "null"
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserView"
        lastSequence:
          type: string
      required:
      - id
      - kind
      - lastSequence
      - members
    UserView:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
      required:
      - id
      - username
    DirectRequest:
      type: object
      properties:
        userId:
          type: string
          pattern: "[0-7][0-9A-HJKMNP-TV-Z]{25}"
      required:
      - userId
    Credentials:
      type: object
      properties:
        username:
          type: string
          maxLength: 40
          minLength: 3
        password:
          type: string
          maxLength: 100
          minLength: 8
        deviceId:
          type:
          - string
          - "null"
      required:
      - password
      - username
    AuthView:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserView"
        deviceId:
          type: string
      required:
      - deviceId
      - token
      - user
    SendStatusView:
      type: object
      properties:
        status:
          type: string
        messageId:
          type:
          - string
          - "null"
        sequence:
          type:
          - string
          - "null"
        reason:
          type:
          - string
          - "null"
      required:
      - status
    HistoryView:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageView"
        nextSequence:
          type: string
      required:
      - messages
      - nextSequence
    MessageView:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        sequence:
          type: string
        senderId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - body
      - conversationId
      - createdAt
      - id
      - senderId
      - sequence
    AuthorizationView:
      type: object
      properties:
        allowed:
          type: boolean
        room:
          type: string
        version:
          type: integer
          format: int32
      required:
      - allowed
      - room
      - version
    SessionView:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        deviceId:
          type: string
      required:
      - deviceId
      - userId
      - username
    ApiProblem:
      type: object
      properties:
        status:
          type: integer
          format: int32
        detail:
          type: string
        code:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
