upstream messenger_api {
    least_conn;
    server api-1:8080 max_fails=3 fail_timeout=10s;
    server api-2:8080 max_fails=3 fail_timeout=10s;
}

upstream messenger_api_grpc {
    server api-1:9090 max_fails=3 fail_timeout=10s;
    server api-2:9090 max_fails=3 fail_timeout=10s;
}

server {
    listen 8083;
    location = /stub_status {
        access_log off;
        stub_status;
    }
}

server {
    listen 9090;
    http2 on;
    location / {
        grpc_pass grpc://messenger_api_grpc;
        grpc_connect_timeout 5s;
        grpc_read_timeout 5s;
    }
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://messenger_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
