components:
  schemas:
    ChatPreferencesResponse:
      type: object
      properties:
        chatId:
          type: string
        pinnedRank:
          type:
          - integer
          - "null"
          format: int32
          maximum: 10
          minimum: 1
        mutedUntil:
          type:
          - string
          - "null"
          format: date-time
        mutedForever:
          type: boolean
        markedUnread:
          type: boolean
      required:
      - chatId
      - markedUnread
      - mutedForever
      - mutedUntil
      - pinnedRank
    PinMessageRequest:
      type: object
      properties:
        scope:
          type: string
          description: SELF is available only in direct chats
          enum:
          - SELF
          - EVERYONE
      required:
      - scope
    PinnedChatsResponse:
      type: object
      properties:
        chatIds:
          type: array
          description: Pinned chat IDs in display order
          items:
            type: string
      required:
      - chatIds
    MuteChatRequest:
      type: object
      properties:
        durationSeconds:
          type:
          - integer
          - "null"
          format: int64
          description: Mute length in seconds; omit or null to mute until unmuted
          maximum: 31622400
          minimum: 60
    ReorderPinnedChatsRequest:
      type: object
      properties:
        chatIds:
          type: array
          description: Every currently pinned chat ID in the new order
          items:
            type: string
          maxItems: 10
          minItems: 0
      required:
      - chatIds
    SendStatusesRequest:
      type: object
      properties:
        requestIds:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 1
      required:
      - requestIds
    SendStatusEntry:
      type: object
      properties:
        requestId:
          type: string
        result:
          $ref: "#/components/schemas/SendStatusResponse"
      required:
      - requestId
      - result
    SendStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - UNKNOWN
          - SAVED
          - REJECTED
        chatId:
          type:
          - string
          - "null"
        messageId:
          type:
          - string
          - "null"
        sequence:
          type:
          - string
          - "null"
        reason:
          type:
          - string
          - "null"
          enum:
          - NOT_A_MEMBER
          - CHAT_NOT_FOUND
          - RECIPIENT_NOT_FOUND
          - INVALID_RECIPIENT
          - EMPTY_BODY
          - BODY_TOO_LONG
          - REQUEST_ID_CONFLICT
          - PROCESSING_FAILED
          - INVALID_REPLY_TARGET
          - INVALID_FORWARD_SOURCE
      required:
      - status
    SendStatusesResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SendStatusEntry"
      required:
      - results
    AdvanceReadRequest:
      type: object
      properties:
        throughSequence:
          type: string
      required:
      - throughSequence
    ReadProgressResponse:
      type: object
      properties:
        throughSequence:
          type: string
        readAt:
          type:
          - string
          - "null"
          format: date-time
        serverTime:
          type: string
          format: date-time
      required:
      - readAt
      - serverTime
      - throughSequence
    MessageResolveRequest:
      type: object
      properties:
        messageIds:
          type: array
          items:
            type: string
      required:
      - messageIds
    MessageResolveResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageResponse"
        snapshotSequence:
          type: string
        mutationSeq:
          type: string
        memberSeq:
          type: string
        clearedThroughSequence:
          type: string
        globalClearedThroughSequence:
          type: string
      required:
      - clearedThroughSequence
      - globalClearedThroughSequence
      - memberSeq
      - messages
      - mutationSeq
      - snapshotSequence
    MessageResponse:
      type: object
      properties:
        id:
          type: string
        chatId:
          type: string
        sequence:
          type: string
        senderId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        messageVersion:
          type: string
        editedAt:
          type:
          - string
          - "null"
          format: date-time
        deletedAt:
          type:
          - string
          - "null"
          format: date-time
        replyToMessageId:
          type:
          - string
          - "null"
        replySenderId:
          type:
          - string
          - "null"
        replyBody:
          type:
          - string
          - "null"
        replyDeleted:
          type:
          - boolean
          - "null"
        replyVersion:
          type:
          - string
          - "null"
        forwardedFromUserId:
          type:
          - string
          - "null"
          description: Original author of a forwarded message
      required:
      - body
      - chatId
      - createdAt
      - deletedAt
      - editedAt
      - id
      - messageVersion
      - replyBody
      - replyDeleted
      - replySenderId
      - replyToMessageId
      - replyVersion
      - senderId
      - sequence
    AddGroupMembersRequest:
      type: object
      properties:
        memberIds:
          type: array
          items:
            type: string
          maxItems: 1000
          minItems: 1
      required:
      - memberIds
    DeletionRequest:
      type: object
      properties:
        requestId:
          type: string
        scope:
          type: string
          enum:
          - SELF
          - EVERYONE
        target:
          type: string
          enum:
          - MESSAGES
          - HISTORY
          - CHAT
        messageIds:
          type:
          - array
          - "null"
          items:
            type: string
      required:
      - requestId
      - scope
      - target
    DeletionResponse:
      type: object
      properties:
        operationId:
          type: string
        scope:
          type: string
          enum:
          - SELF
          - EVERYONE
        target:
          type: string
          enum:
          - MESSAGES
          - HISTORY
          - CHAT
        clearedThroughSequence:
          type: string
        seq:
          type: string
        memberSeq:
          type: string
        state:
          type: string
          enum:
          - ACCEPTED
          - COMPLETED
        deletedRows:
          type: string
      required:
      - clearedThroughSequence
      - deletedRows
      - memberSeq
      - operationId
      - scope
      - seq
      - state
      - target
    CreateGroupChatRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 0
        memberIds:
          type: array
          items:
            type: string
          maxItems: 999
          minItems: 1
      required:
      - memberIds
      - name
    ChatLastMessageResponse:
      type: object
      properties:
        id:
          type: string
        sequence:
          type: string
        senderId:
          type: string
        senderUsername:
          type: string
        createdAt:
          type: string
          format: date-time
        bodyPreview:
          type: string
        deleted:
          type: boolean
      required:
      - bodyPreview
      - createdAt
      - deleted
      - id
      - senderId
      - senderUsername
      - sequence
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - DIRECT
          - GROUP
        name:
          type:
          - string
          - "null"
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        memberCount:
          type: integer
          format: int32
        lastSequence:
          type: string
        ownerId:
          type:
          - string
          - "null"
        lastMessage:
          description: Latest visible message in the newest 256 rows; null can leave
            older visible history
          oneOf:
          - $ref: "#/components/schemas/ChatLastMessageResponse"
          - type: "null"
        unreadCount:
          type: integer
          format: int32
          description: Visible other-author unread messages in the newest 256 candidates;
            lower bound when capped
          maximum: 256
          minimum: 0
        activityAt:
          type:
          - string
          - "null"
          format: date-time
        unreadCountCapped:
          type: boolean
          description: True for 256 raw unread candidates; real count may be higher
            even when unreadCount is zero
        pinnedRank:
          type:
          - integer
          - "null"
          format: int32
          description: Viewer's pin position; pinned chats lead the first directory
            page
          maximum: 10
          minimum: 1
        mutedUntil:
          type:
          - string
          - "null"
          format: date-time
          description: End of a timed mute
        mutedForever:
          type: boolean
        markedUnread:
          type: boolean
          description: Viewer marked this chat to read later
      required:
      - id
      - kind
      - lastSequence
      - memberCount
      - members
    UserResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
      required:
      - id
      - username
    WsTicketResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: integer
          format: int64
      required:
      - expiresAt
      - token
    RevokedSessionsResponse:
      type: object
      properties:
        revokedSessions:
          type: integer
          format: int32
      required:
      - revokedSessions
    AuthRequest:
