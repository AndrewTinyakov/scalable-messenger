$schema: http://json-schema.org/draft-07/schema#
title: SocketSendRejectedV1
x-messenger-direction: server
type: object
additionalProperties: false
required:
  - type
  - version
  - eventId
  - room
  - requestId
  - reason
  - epoch
  - streamId
oneOf:
  - required:
      - chatId
  - required:
      - recipientId
properties:
  type:
    const: send_rejected
  version:
    type: integer
    const: 1
  eventId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  room:
    type: string
    pattern: ^(user|group):[0-7][0-9A-HJKMNP-TV-Z]{25}$
  chatId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  recipientId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  requestId:
    type: string
    pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  reason:
    type: string
    enum:
      - NOT_A_MEMBER
      - CHAT_NOT_FOUND
      - RECIPIENT_NOT_FOUND
      - INVALID_RECIPIENT
      - EMPTY_BODY
      - BODY_TOO_LONG
      - REQUEST_ID_CONFLICT
      - PROCESSING_FAILED
      - INVALID_REPLY_TARGET
      - INVALID_FORWARD_SOURCE
  epoch:
    type: string
    minLength: 1
  streamId:
    type: string
    pattern: ^[0-9]+-[0-9]+$
