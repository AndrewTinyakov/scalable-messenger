roomEvents:
  address: messenger:{room}:live
  description: Redis sharded Pub/Sub channel. The publisher appends bodyless recovery hints to messenger:{room}:stream before SPUBLISH of
    {epoch,streamId,previousStreamId,event} containing the full ephemeral live event. Replayed hints coalesce per chat and require viewer-authorized SQL recovery. The previous Stream ID lets a subscriber detect a missed live publication without reading Redis
    on every event; an empty value means the new epoch has no predecessor. Room is user:<ULID> or group:<ULID>; the braces form a Redis hash
    tag. A member_removed event in a group room revokes the named member before later events in that room reach the member's socket.
  parameters:
    room:
      description: Logical user or group room.
  messages:
    ChatCreatedEventV1:
      $ref: ../messages.yaml#/messages/ChatCreatedEventV1
    MemberRemovedEventV1:
      $ref: ../messages.yaml#/messages/MemberRemovedEventV1
    SessionRevokedEventV1:
      $ref: ../messages.yaml#/messages/SessionRevokedEventV1
    MessageSavedEventV1:
      $ref: ../messages.yaml#/messages/MessageSavedEventV1
    SendRejectedEventV1:
      $ref: ../messages.yaml#/messages/SendRejectedEventV1
    MembershipChangedEventV1:
      $ref: ../messages.yaml#/messages/MembershipChangedEventV1
    MessageChangedEventV1:
      $ref: ../messages.yaml#/messages/MessageChangedEventV1
    ChatDeletedEventV1:
      $ref: ../messages.yaml#/messages/ChatDeletedEventV1
    ReadsChangedEventV1:
      $ref: ../messages.yaml#/messages/ReadsChangedEventV1
    HistoryChangedEventV1:
      $ref: ../messages.yaml#/messages/HistoryChangedEventV1
