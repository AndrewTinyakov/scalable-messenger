$schema: http://json-schema.org/draft-07/schema#
title: SocketUnsubscribeV1
type: object
additionalProperties: false
required: [type, version, chatId]
properties:
  type:
    const: unsubscribe
  version:
    type: integer
    const: 1
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
