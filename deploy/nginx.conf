upstream messenger_api { server api:3001; }
upstream messenger_gateway { least_conn; server gateway:3002; server gateway-two:3002; }
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://messenger_api; proxy_set_header Host $host; }
  location /ws {
    proxy_pass http://messenger_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
