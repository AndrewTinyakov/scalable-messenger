$schema: http://json-schema.org/draft-07/schema#
title: SocketAppliedV1
type: object
additionalProperties: false
required: [type, version, conversationId, sequence]
properties:
  type:
    const: applied
  version:
    type: integer
    const: 1
  conversationId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  sequence:
    type: string
    pattern: '^(0|[1-9][0-9]*)$'
  epoch:
    type: string
  streamId:
    type: string
