syntax = "proto3";

package messenger.authorization.v1;

option java_package = "com.andrewtinyakov.messenger.generated.grpc";
option java_multiple_files = true;
option go_package = "messenger/ws/internal/generated/grpc;authorization";

service ChatAuthorization {
  rpc AuthorizeSidebar(AuthorizeSidebarRequest) returns (AuthorizeSidebarResponse);
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  rpc AuthorizeGroup(AuthorizeGroupRequest) returns (AuthorizeGroupResponse);
  rpc AuthorizeGroups(AuthorizeGroupsRequest) returns (AuthorizeGroupsResponse);
  rpc AuthorizePresence(AuthorizePresenceRequest) returns (AuthorizePresenceResponse);
}

message ValidateSessionRequest {
  reserved 1;
  reserved "ws_ticket";
  string session_id = 2;
}

message ValidateSessionResponse {
  string user_id = 1;
  string device_id = 2;
  string session_id = 3;
}

message AuthorizeGroupRequest {
  string chat_id = 1;
  reserved 2;
  reserved "ws_ticket";
  string session_id = 3;
}

message AuthorizeGroupResponse {
  string room = 1;
}

message AuthorizeGroupsRequest {
  repeated string chat_ids = 1;
  reserved 2;
  reserved "ws_ticket";
  string session_id = 3;
}

message AuthorizeGroupsResponse {
  repeated string authorized_chat_ids = 1;
}

message AuthorizePresenceRequest {
  string session_id = 1;
  string chat_id = 2;
  repeated string user_ids = 3;
}

message AuthorizePresenceResponse {
  repeated string authorized_user_ids = 1;
}

message AuthorizeSidebarRequest {
  string session_id = 1;
  repeated string chat_ids = 2;
}
message SidebarChat {
  string chat_id = 1;
  string peer_id = 2;
  bool group = 3;
}
message AuthorizeSidebarResponse {
  repeated SidebarChat chats = 1;
}
