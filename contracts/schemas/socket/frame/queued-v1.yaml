$schema: http://json-schema.org/draft-07/schema#
title: SocketQueuedV1
type: object
additionalProperties: false
required: [type, version, requestId]
oneOf:
  - required: [chatId]
  - required: [recipientId]
properties:
  type:
    const: queued
  version:
    type: integer
    const: 1
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  recipientId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  requestId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
