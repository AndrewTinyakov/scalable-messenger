name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 1s --health-retries 30
    env:
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Compile, lint and test Kotlin
        run: ./kotlin/gradlew -p kotlin --build-cache --parallel verifyKotlin -PapiTestShard=remaining

  kotlin-api-auth-and-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Test API authentication and infrastructure
        run: ./kotlin/gradlew -p kotlin --build-cache --parallel :api:test -PapiTestShard=auth-and-infrastructure

  go:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 1s --health-retries 30
    env:
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.10
          cache-dependency-path: |
            ws/go.sum
            tests/load/ws/go.sum
      - name: Compile and lint Go
        run: |
          go -C ws build -o /dev/null ./...
          go -C tests/load/ws build -o /dev/null ./...
          go -C ws vet ./...
          go -C tests/load/ws vet ./...
          npm run format:go:check
      - name: Run Go unit tests
        run: |
          go -C ws test -race -count=1 -timeout=120s ./...
          go -C tests/load/ws test -short -timeout=60s ./...

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install JavaScript dependencies
        run: npm --prefix client ci
      - name: Build and lint the client
        env:
          VITE_API_BASE_URL: https://api.example.com/api
          VITE_WS_URL: wss://ws.example.com/ws
        run: |
          npm --prefix client run build
          npm --prefix client run format:check
      - name: Run client unit tests
        run: npm --prefix client test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.10
          cache: false
      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix contracts ci
      - name: Check contracts and generated message models
        run: |
          npm run validate:asyncapi
          npm run test:contracts
          npm run generate:asyncapi:kotlin
          npm run generate:asyncapi:go
          git add --intent-to-add kotlin/shared/src/generated/asyncapi/kotlin ws/internal/generated/messaging client/src/shared/api/generated/socket-vocabulary.ts
          git diff --exit-code -- kotlin/shared/src/generated/asyncapi/kotlin ws/internal/generated/messaging client/src/shared/api/generated/socket-vocabulary.ts
      - name: Check realistic load driver
        run: |
          shopt -s failglob
          node --test tests/realistic-load/*.test.mjs

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install JavaScript dependencies
        run: npm --prefix client ci
      - name: Validate deployment configuration
        run: |
          node scripts/prepare-dev-env.mjs
          docker compose config --quiet
          MESSENGER_CLIENT_ORIGIN=https://example.com MESSENGER_TRUSTED_PROXY_CIDRS=192.0.2.0/24 docker compose -f compose.yaml -f compose.production.yaml config --quiet
          node --test scripts/deployment.test.mjs
          docker compose run --rm --no-deps -T api-proxy nginx -t
          docker compose run --rm --no-deps -T ws-proxy nginx -t
          MESSENGER_CLIENT_ORIGIN=https://example.com MESSENGER_TRUSTED_PROXY_CIDRS=192.0.2.0/24 docker compose -f compose.yaml -f compose.production.yaml run --rm --no-deps -T api-proxy nginx -t
          MESSENGER_CLIENT_ORIGIN=https://example.com MESSENGER_TRUSTED_PROXY_CIDRS=192.0.2.0/24 docker compose -f compose.yaml -f compose.production.yaml run --rm --no-deps -T ws-proxy nginx -t
          docker compose run --rm --no-deps -T monitoring-access nginx -t
          docker compose run --rm --no-deps -T --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yaml
      - name: Remove deployment validation resources
        if: always()
        run: docker compose down --volumes

  verify:
    needs: [kotlin, kotlin-api-auth-and-infrastructure, go, client, contracts, deployment]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to pass
        env:
          JOBS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$JOBS"
