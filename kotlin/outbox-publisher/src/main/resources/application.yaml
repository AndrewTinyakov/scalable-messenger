server:
  port: 8082
spring:
  application:
    name: messenger-outbox-publisher
  jackson:
    default-property-inclusion: non_null
  security:
    user:
      name: ${METRICS_USERNAME:metrics}
      password: ${METRICS_PASSWORD:${random.uuid}}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      data-source-properties:
        ApplicationName: messenger-outbox-publisher
  flyway:
    enabled: true
  jooq:
    sql-dialect: postgres
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${messenger.publisher.publish-timeout-ms:1000}ms
      connect-timeout: ${messenger.publisher.publish-timeout-ms:1000}ms
      lettuce:
        cluster:
          refresh:
            period: 5s
            dynamic-refresh-sources: false
messenger:
  redis:
    presence:
      # The gateways' presence Redis settings; both empty means the room Redis.
      url: ${PRESENCE_REDIS_URL:}
      cluster-nodes: ${PRESENCE_REDIS_CLUSTER_NODES:}
      room-cluster-nodes: ${spring.data.redis.cluster.nodes:}
      room-username: ${spring.data.redis.username:}
      room-password: ${spring.data.redis.password:}
      room-ssl: ${spring.data.redis.ssl.enabled:false}
    room:
      history-max-length: 1000
      idle-ttl-seconds: 3600
  publisher:
    poll-ms: 1000
    batch-size: 100
    lease-seconds: 30
    concurrency: 16
    batch-bytes: 4194304
    publish-timeout-ms: 1000
management:
  metrics:
    distribution:
      slo:
        hikaricp.connections.acquire: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
        hikaricp.connections.usage: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
      percentiles-histogram:
        messenger.outbox.batch: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
