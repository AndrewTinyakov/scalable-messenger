  /v1/users:
    get:
      tags:
      - user-controller
      operationId: search
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
