$schema: http://json-schema.org/draft-07/schema#
title: SocketMemberRemovedV1
x-messenger-direction: server
type: object
additionalProperties: false
required: [type, version, eventId, room, chatId, memberId, epoch, streamId]
oneOf:
  - required:
      - seq
  - required:
      - userSeq
properties:
  type:
    const: member_removed
  version:
    type: integer
    const: 1
  eventId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  room:
    type: string
    pattern: '^(user|group):[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  chatId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  memberId:
    type: string
    pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
  seq:
    type: string
    pattern: ^[1-9][0-9]{0,18}$
  userSeq:
    type: string
    pattern: ^[1-9][0-9]{0,18}$
  epoch:
    type: string
    minLength: 1
  streamId:
    type: string
    pattern: '^[0-9]+-[0-9]+$'
